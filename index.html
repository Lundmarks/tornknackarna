<body>

<script>
const GIST_USER       = 'Lundmarks';
const INDEX_GIST_ID   = 'bd51bdad423fb0050aef6f7adea11c4e';
const OUR_TEAM_GIST_ID= '6bb4217e29ad303db186fc70a5bac583';
const MEDALS_BASE     = 'medals/';

function gistUrl(gistId){return`https://gist.githubusercontent.com/${GIST_USER}/${gistId}/raw/data.json`;}

let _nextMatchDate=null;
function getLogoSpeed(){const BASE=0.50,MAX=2.2;if(!_nextMatchDate)return BASE;const msLeft=_nextMatchDate-Date.now();if(msLeft<=0)return MAX;const days=msLeft/(1000*60*60*24);const t=Math.max(0,Math.min(1,1-days/14));return BASE+(MAX-BASE)*t;}

let currentSeasonOnly=true;
let _currentMatchData=null;
let _currentMatchContext=null;

const THEMES=['dark','light','console'];
const THEME_LABELS={dark:'Dark',light:'Light',console:'Console'};
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);const btn=document.getElementById('theme-toggle');if(btn)btn.textContent=THEME_LABELS[t]||t;if(t==='console')setTimeout(startConsoleLogo,0);if(t==='dark'||t==='light')setTimeout(startCleanLogo,0);}
function cycleTheme(){const cur=document.documentElement.getAttribute('data-theme')||'dark';const next=THEMES[(THEMES.indexOf(cur)+1)%THEMES.length];localStorage.setItem('theme',next);applyTheme(next);}
applyTheme(localStorage.getItem('theme')||'dark');

async function fetchGist(gistId){const r=await fetch(gistUrl(gistId));if(!r.ok)throw new Error(`Gist fetch ${r.status} for ${gistId}`);return r.json();}

function profileLinks(accountId){if(!accountId)return '';return`<div class="player-links"><a class="player-link" href="https://www.dotabuff.com/players/${accountId}" target="_blank" rel="noopener noreferrer">Dotabuff</a><a class="player-link" href="https://www.opendota.com/players/${accountId}" target="_blank" rel="noopener noreferrer">OpenDota</a></div>`;}

const RANK_THEME={Herald:{lbg:'#f3f4f6',lc:'#374151',dbg:'#1c1f27',dc:'#9ca3af'},Guardian:{lbg:'#f0fdf4',lc:'#166534',dbg:'#0d2b1a',dc:'#4ade80'},Crusader:{lbg:'#fffbeb',lc:'#92400e',dbg:'#271a05',dc:'#fbbf24'},Archon:{lbg:'#fff7ed',lc:'#9a3412',dbg:'#2a1208',dc:'#fb923c'},Legend:{lbg:'#fff1f2',lc:'#9f1239',dbg:'#2a0a10',dc:'#fb7185'},Ancient:{lbg:'#f5f3ff',lc:'#6d28d9',dbg:'#1a1040',dc:'#a78bfa'},Divine:{lbg:'#fefce8',lc:'#854d0e',dbg:'#201a04',dc:'#fde047'},Immortal:{lbg:'#ecfeff',lc:'#0e7490',dbg:'#042028',dc:'#22d3ee'},Unknown:{lbg:'#f3f4f6',lc:'#6b7280',dbg:'#1c1f27',dc:'#6b7280'}};
function rankBadgeHTML(rankMedal,rankLabel){const medal=rankMedal||'Unknown';const cfg=RANK_THEME[medal]||RANK_THEME.Unknown;const isLight=document.documentElement.getAttribute('data-theme')==='light';const bg=isLight?cfg.lbg:cfg.dbg,color=isLight?cfg.lc:cfg.dc;const imgUrl=`${MEDALS_BASE}${medal.toLowerCase().replace(/\s+/g,'_')}.png`;return`<div class="rank-badge" style="background:${bg};color:${color}"><img class="rank-medal-img" src="${imgUrl}" alt="${medal}" onerror="this.style.display='none'">${rankLabel||'Unknown'}</div>`;}

const HERO_SLUG={'Anti-Mage':'antimage','Axe':'axe','Beastmaster':'beastmaster','Bristleback':'bristleback','Centaur':'centaur','Centaur Warrunner':'centaur','Chen':'chen','Clockwerk':'rattletrap','Crystal Maiden':'crystal_maiden','Dark Willow':'dark_willow','Death Prophet':'death_prophet','Dragon Knight':'dragon_knight','Drow Ranger':'drow_ranger','Earth Spirit':'earth_spirit','Earthshaker':'earthshaker','Ember Spirit':'ember_spirit','Enigma':'enigma','Huskar':'huskar','Invoker':'invoker','Jakiro':'jakiro','Juggernaut':'juggernaut','Leshrac':'leshrac','Lina':'lina','Lion':'lion','Lycan':'lycan','Magnus':'magnataur','Mars':'mars','Medusa':'medusa','Muerta':'muerta','Naga Siren':'naga_siren',"Nature's Prophet":'furion','Omniknight':'omniknight','Phantom Assassin':'phantom_assassin','Phantom Lancer':'phantom_lancer','Phoenix':'phoenix','Pudge':'pudge','Puck':'puck','Queen of Pain':'queenofpain','Razor':'razor','Rubick':'rubick','Shadow Demon':'shadow_demon','Shadow Fiend':'nevermore','Shadow Shaman':'shadow_shaman','Slardar':'slardar','Snapfire':'snapfire','Spectre':'spectre','Spirit Breaker':'spirit_breaker','Storm Spirit':'storm_spirit','Techies':'techies','Templar Assassin':'templar_assassin','Timbersaw':'shredder','Tinker':'tinker','Tidehunter':'tidehunter','Troll Warlord':'troll_warlord','Ursa':'ursa','Vengeful Spirit':'vengefulspirit','Viper':'viper','Void Spirit':'void_spirit','Warlock':'warlock','Weaver':'weaver','Winter Wyvern':'winter_wyvern','Witch Doctor':'witch_doctor','Wraith King':'skeleton_king','Clinkz':'clinkz','Disruptor':'disruptor','Gyrocopter':'gyrocopter','Skywrath Mage':'skywrath_mage','Tiny':'tiny','Pugna':'pugna','Lich':'lich','Windranger':'windrunner','Sven':'sven','Bounty Hunter':'bounty_hunter','Legion Commander':'legion_commander','Mirana':'mirana','Hoodwink':'hoodwink','Bane':'bane','Dazzle':'dazzle','Abaddon':'abaddon','Alchemist':'alchemist','Ancient Apparition':'ancient_apparition','Arc Warden':'arc_warden','Batrider':'batrider','Bloodseeker':'bloodseeker','Brewmaster':'brewmaster','Broodmother':'broodmother','Chaos Knight':'chaos_knight','Doom':'doom','Elder Titan':'elder_titan','Faceless Void':'faceless_void','Grimstroke':'grimstroke','Io':'wisp','Keeper of the Light':'keeper_of_the_light','Kunkka':'kunkka','Lifestealer':'life_stealer','Lone Druid':'lone_druid','Marci':'marci','Meepo':'meepo','Monkey King':'monkey_king','Morphling':'morphling','Night Stalker':'night_stalker','Nyx Assassin':'nyx_assassin','Ogre Magi':'ogre_magi','Oracle':'oracle','Outworld Destroyer':'obsidian_destroyer','Pangolier':'pangolier','Primal Beast':'primal_beast','Ring Master':'ringmaster','Riki':'riki','Sand King':'sand_king','Silencer':'silencer','Slark':'slark','Terrorblade':'terrorblade','Treant Protector':'treant','Tusk':'tusk','Underlord':'underlord','Undying':'undying','Venomancer':'venomancer','Visage':'visage','Zeus':'zuus','Necrophos':'necrolyte','Sniper':'sniper','Luna':'luna','Enchantress':'enchantress','Kez':'kez','Dawnbreaker':'dawnbreaker','Largo':'largo','Dark Seer':'dark_seer','Ringmaster':'ringmaster'};
function heroIconUrl(name,directUrl){if(directUrl)return directUrl.startsWith('http')?directUrl:`https://steamcdn-a.akamaihd.net${directUrl}`;const slug=HERO_SLUG[name];if(slug)return`https://steamcdn-a.akamaihd.net/apps/dota2/images/dota_react/heroes/icons/${slug}.png`;return DA.heroIconMap[name]||null;}
function heroIconTag(name,wrapClass,directUrl){const url=heroIconUrl(name,directUrl);return`<div class="${wrapClass}">${url?`<img src="${url}" alt="${name}" loading="lazy" onerror="this.parentElement.style.opacity='0.3'">`:''}</div>`;}

function resolveHeroStats(h){if(currentSeasonOnly){return{games:h.currentSeasonGames??h.tournamentGames,wr:h.currentSeasonWR??h.tournamentWR};}return{games:h.tournamentGames,wr:h.tournamentWR};}

function seasonToggleHTML(){const isConsole=document.documentElement.getAttribute('data-theme')==='console';const csLabel=isConsole?'CURRENT SEASON':'Current season';const allLabel=isConsole?'ALL SEASONS':'All seasons';return`<div class="season-toggle-wrap"><button class="season-toggle-btn${currentSeasonOnly?' active':''}" onclick="setSeasonFilter(true)">${csLabel}</button><div class="season-divider"></div><button class="season-toggle-btn${!currentSeasonOnly?' active':''}" onclick="setSeasonFilter(false)">${allLabel}</button></div>`;}

function setSeasonFilter(csOnly){if(currentSeasonOnly===csOnly)return;currentSeasonOnly=csOnly;if(_currentMatchData&&_currentMatchContext){if(_currentMatchContext.isSelf)_renderOurTeamPanel(_currentMatchData);else _renderMatchPanel(_currentMatchData,_currentMatchContext.meetingId);}}

function keyPickScore(h){const{games,wr}=resolveHeroStats(h);if(!games)return 0;const delta=Math.max(0,wr-(h.pubWR||wr));const deltaMult=1+Math.min(delta/40,0.5);const recency=(!currentSeasonOnly&&h.recentSeason)?1.15:1.0;return(wr/100)*Math.log(games+1)*deltaMult*recency;}
function priorityLabel(s){return s>=2.4?'high':s>=1.6?'med':'low';}
function banReason(h){const{games,wr}=resolveHeroStats(h);const delta=Math.max(0,wr-(h.pubWR||wr));const parts=[];if(games>=4)parts.push(`${games} CM games`);if(wr>=65)parts.push(`${wr}% CM wr`);if(delta>=15)parts.push(`+${delta}pp vs pub`);return parts.join(' \u00b7 ')||'Moderate threat';}
function computeBans(players){const cands=[];for(const p of players)for(const h of(p.tournamentHeroes||[])){const score=keyPickScore(h);if(score)cands.push({hero:h,player:p.name,score,priority:priorityLabel(score)});}cands.sort((a,b)=>b.score-a.score);const seen=new Set();return cands.filter(c=>{if(seen.has(c.hero.name))return false;seen.add(c.hero.name);return true;}).slice(0,6);}

function renderBanSection(players){const bans=computeBans(players);const isConsole=document.documentElement.getAttribute('data-theme')==='console';if(!bans.length)return'<div style="color:var(--ink-4);font-size:13px;margin-bottom:32px">No CM data yet \u2014 ban suggestions will appear after the opponent plays their first match.</div>';const maxScore=bans[0].score||1;const banCard=b=>{const norm=Math.min(100,(b.score/maxScore)*100).toFixed(0);const{games,wr}=resolveHeroStats(b.hero);return`<div class="ban-card priority-${b.priority}"><div class="ban-priority-dot"></div>${heroIconTag(b.hero.name,'ban-hero-icon',b.hero.iconUrl)}<div class="ban-body"><div class="ban-hero-name">${b.hero.name}</div><div class="ban-owner">${b.player}</div><div class="ban-stats"><span class="ban-stat">${games} CM games</span><span class="ban-stat">${wr}% CM wr</span>${b.hero.pubWR?`<span class="ban-stat">${b.hero.pubWR}% pub wr</span>`:''}${''}</div><div class="ban-reason">${banReason(b.hero)}</div><div class="ban-score-bar"><div class="ban-score-fill" style="width:${norm}%"></div></div></div></div>`;};const tier=(label,color,items)=>!items.length?'':`<div style="margin-bottom:20px"><div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${color};margin-bottom:8px;display:flex;align-items:center;gap:6px;${isConsole?'font-family:Orbitron,monospace;letter-spacing:3px;':''}"><span style="display:inline-block;width:6px;height:6px;border-radius:${isConsole?'0':'50%'};background:${color}"></span>${label}</div><div class="ban-grid">${items.map(banCard).join('')}</div></div>`;const high=bans.filter(b=>b.priority==='high');const med=bans.filter(b=>b.priority==='med');const low=bans.filter(b=>b.priority==='low');return`<div class="ban-section"><div class="section-title">${isConsole?'// ':''}Suggested bans</div>${tier('Priority bans','var(--ban-high)',high)}${tier('Moderate threats','var(--ban-med)',med)}${tier('Situational','#9ca3af',low)}<div style="font-size:11px;color:var(--ink-4);margin-top:4px;line-height:1.5${isConsole?';font-family:Share Tech Mono,monospace':''}">Scored by CM winrate, games played, delta vs pub winrate, and recency.</div></div>`;}

function renderDraftOrderPatterns(patterns){if(!patterns||!patterns.length)return'';const isConsole=document.documentElement.getAttribute('data-theme')==='console';const bans=patterns.filter(p=>!p.isPick);const picks=patterns.filter(p=>p.isPick);const firstBan=bans.find(p=>p.slot===0);const firstPick=picks.find(p=>p.slot===0);const spotlight=(p,color,label)=>{if(!p)return'';const src=heroIconUrl(p.hero,p.iconUrl||'')||'';const icon=src?`<img src="${src}" alt="${p.hero}" style="width:32px;height:32px;border-radius:5px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">`:`<div style="width:32px;height:32px;border-radius:5px;background:var(--line-2);flex-shrink:0"></div>`;return`<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:140px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid ${color};border-radius:${isConsole?'0':'8px'}">${icon}<div style="min-width:0"><div style="font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${color};margin-bottom:2px;${isConsole?'font-family:Orbitron,monospace;':''}">${label}</div><div style="font-size:13px;font-weight:600;color:var(--ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.hero}</div><div style="font-size:10px;color:var(--ink-4);font-family:var(--mono)">${p.pct}% of games</div></div></div>`;};const chip=p=>{const src=heroIconUrl(p.hero,p.iconUrl||'')||'';const icon=src?`<img src="${src}" alt="${p.hero}" style="width:18px;height:18px;border-radius:3px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">`:'';;const color=p.isPick?'var(--win)':'var(--loss)';return`<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--surface);border:1px solid var(--line);border-radius:${isConsole?'0':'6px'};min-width:0"><span style="font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--ink-4);white-space:nowrap;min-width:52px;${isConsole?'font-family:Orbitron,monospace;font-size:8px;':''}">${p.label.toUpperCase()}</span>${icon}<span style="font-size:12px;color:var(--ink-1);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.hero}</span><span style="font-size:10px;color:${color};font-weight:600;flex-shrink:0;font-family:var(--mono)">${p.pct}%</span></div>`;};
const col=(title,items,color)=>!items.length?'':`<div style="flex:1;min-width:180px"><div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${color};margin-bottom:8px;${isConsole?'font-family:Orbitron,monospace;letter-spacing:3px;':''}">${isConsole?'// ':''}${title}</div><div style="display:flex;flex-direction:column;gap:4px">${items.map(chip).join('')}</div></div>`;const spotlightHtml=(firstBan||firstPick)?`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">${spotlight(firstBan,'var(--loss)','First ban')}${spotlight(firstPick,'var(--win)','First pick')}</div>`:'';const fullBreakdown=(bans.length>1||picks.length>1)?`<div style="display:flex;gap:20px;flex-wrap:wrap">${col('Ban order',bans,'var(--loss)')}${col('Pick order',picks,'var(--win)')}</div>`:'';return`<div style="margin-top:20px"><div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);${isConsole?'font-family:Orbitron,monospace;letter-spacing:3px;':''}">${isConsole?'// ':''}Draft order tendencies</div>${spotlightHtml}${fullBreakdown}</div>`;}

function renderDraftTendencies(tendencies){if(!tendencies||!tendencies.totalGames)return'';const isConsole=document.documentElement.getAttribute('data-theme')==='console';const total=tendencies.totalGames;const heroIconSmall=(name,iconUrl)=>{const src=heroIconUrl(name,iconUrl||'')||'';return src?`<img src="${src}" alt="${name}" style="width:20px;height:20px;border-radius:3px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">`:'';}; const row=item=>{const pct=Math.round(item.count/total*100);const barW=Math.min(100,pct);return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><div style="width:20px;height:20px;flex-shrink:0">${heroIconSmall(item.name,item.iconUrl||'')}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px"><span style="font-size:12px;color:var(--ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name}</span><span style="font-size:11px;color:var(--ink-3);flex-shrink:0;margin-left:8px">${item.count}\u00d7&nbsp;<span style="color:var(--ink-4)">${pct}%</span></span></div><div style="height:3px;background:var(--surface-2);border-radius:2px"><div style="height:3px;width:${barW}%;background:var(--accent);border-radius:2px;opacity:0.7"></div></div></div></div>`;};
const col=(title,items,color)=>!items||!items.length?'':`<div style="flex:1;min-width:180px"><div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${color};margin-bottom:10px;${isConsole?'font-family:Orbitron,monospace;letter-spacing:3px;':''}">${isConsole?'// ':''}${title}</div>${items.map(row).join('')}</div>`;return`<div class="ban-section" style="margin-top:28px"><div class="section-title" style="margin-bottom:4px">${isConsole?'// ':''}Draft presence</div><div style="font-size:11px;color:var(--ink-4);margin-bottom:16px">Based on ${total} tracked game${total===1?'':'s'}</div><div style="display:flex;gap:32px;flex-wrap:wrap">${col('Most banned',tendencies.mostBanned,'var(--loss)')}${col('Most picked',tendencies.mostPicked,'var(--win)')}</div>${renderDraftOrderPatterns(tendencies.orderPatterns)}</div>`;}

// ── Hero winrate breakdown: computed from history, per team ───────────────────
// "with"    = scouted team picked hero X; did they win?
// "against" = opponent picked hero X;     did scouted team win?
// Skips history entries that lack opponentTeam/opponentWon (old bins).
// Respects the season toggle.

function computeMatchupStats(history,currentSeasonId){const withMap={};const againstMap={};for(const m of(history||[])){if(currentSeasonOnly&&m.seasonId!=null&&m.seasonId!==currentSeasonId)continue;if(m.opponentTeam==null||m.opponentWon==null)continue;const ourTeam=m.opponentTeam===0?1:0;const ourWon=!m.opponentWon;for(const pk of(m.picks||[])){const name=pk.heroName;if(!name)continue;const iconUrl=pk.iconUrl||'';if(pk.team===ourTeam){if(!withMap[name])withMap[name]={wins:0,games:0,iconUrl};withMap[name].games++;if(ourWon)withMap[name].wins++;}else{if(!againstMap[name])againstMap[name]={wins:0,games:0,iconUrl};againstMap[name].games++;if(ourWon)againstMap[name].wins++;}}}const toList=map=>Object.entries(map).map(([name,s])=>({name,iconUrl:s.iconUrl,games:s.games,wr:s.games>0?Math.round(100*s.wins/s.games):0}));return{withList:toList(withMap).sort((a,b)=>b.wr-a.wr||b.games-a.games),againstList:toList(againstMap).sort((a,b)=>a.wr-b.wr||b.games-a.games)};}

function renderMatchupStats(history,currentSeasonId){if(!history||!history.length)return'';if(!history.some(m=>m.opponentTeam!=null&&m.opponentWon!=null))return'';const{withList,againstList}=computeMatchupStats(history,currentSeasonId);if(!withList.length&&!againstList.length)return'';const isConsole=document.documentElement.getAttribute('data-theme')==='console';const seasonNote=currentSeasonOnly?' \u00b7 current season':' \u00b7 all seasons';const heroRow=(h,colorVar)=>{const icon=heroIconUrl(h.name,h.iconUrl||'');const iconHtml=icon?`<img src="${icon}" alt="${h.name}" style="width:20px;height:20px;border-radius:${isConsole?'0':'3px'};object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">`:`<div style="width:20px;height:20px;flex-shrink:0"></div>`;return`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-2)">${iconHtml}<span style="flex:1;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h.name}</span><span style="font-size:9px;color:var(--ink-4);margin-left:4px">${h.games}g</span><span style="font-size:12px;font-weight:600;color:${colorVar};font-family:var(--mono);flex-shrink:0;min-width:32px;text-align:right">${h.wr}%</span></div>`;};const col=(title,items,colorVar,emptyMsg)=>`<div style="flex:1;min-width:180px"><div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${colorVar};margin-bottom:10px;${isConsole?'font-family:Orbitron,monospace;letter-spacing:3px;':''}">${isConsole?'// ':''}${title}</div>${items.length?items.slice(0,5).map(h=>heroRow(h,colorVar)).join(''):`<div style="font-size:12px;color:var(--ink-4)">${emptyMsg}</div>`}</div>`;return`<div class="ban-section" style="margin-top:28px"><div class="section-title" style="margin-bottom:4px">${isConsole?'// ':''}Hero winrate breakdown</div><div style="font-size:11px;color:var(--ink-4);margin-bottom:16px">From E-Sparven match history${seasonNote}. Game count shown \u2014 small samples may not reflect true trends.</div><div style="display:flex;gap:32px;flex-wrap:wrap">${col('Highest winrate with',withList,'var(--win)','No data')}${col('Lowest winrate against',againstList,'var(--loss)','No data')}</div></div>`;}

function wrClass(wr){return wr>=60?'high':wr<45?'low':'';}

function renderHeroRows(heroes,isTournament,isSelf){if(!heroes||!heroes.length)return'<div style="font-size:12px;color:var(--ink-4);padding:4px 0">No data</div>';if(isTournament){heroes=[...heroes].sort((a,b)=>{const sa=resolveHeroStats(a),sb=resolveHeroStats(b);return sb.games-sa.games||sb.wr-sa.wr;});}let anyVisible=false;const rows=heroes.map(h=>{let wr,games;if(isTournament){const s=resolveHeroStats(h);wr=s.wr;games=s.games;if(games===0)return'';}else{wr=h.wr;games=h.games;}anyVisible=true;const isKey=!isSelf&&isTournament&&keyPickScore(h)>=2.4&&games>=3;return`<div class="hero-row">${heroIconTag(h.name,'hero-icon-wrap',h.iconUrl)}<div class="hero-name">${h.name}</div><div class="hero-games">${games}g</div><div class="hero-wr-bar"><div class="hero-wr-fill ${wrClass(wr)}" style="width:${wr}%"></div></div><div class="hero-wr-pct">${wr}%</div>${isKey?'<div class="key-pick-dot" title="Ban candidate"></div>':'<div style="width:6px"></div>'}</div>`;}).join('');return anyVisible?rows:'<div style="font-size:12px;color:var(--ink-4);padding:4px 0">No games this season</div>';}

function renderPlayerCard(p,isSelf){const form=(p.form||[]).map(r=>`<div class="form-pip ${r}">${r.toUpperCase()}</div>`).join('');const noId=!p.accountId?`<span style="font-size:9px;color:var(--ink-4);margin-left:6px;font-weight:600">no ID</span>`:'';const hasBanCandidate=!isSelf&&(p.tournamentHeroes||[]).some(h=>{const{games}=resolveHeroStats(h);return keyPickScore(h)>=2.4&&games>=3;});const isConsole=document.documentElement.getAttribute('data-theme')==='console';return`<div class="player-card"><div class="player-card-top"><div class="player-meta"><div class="player-name">${p.name}${noId}</div>${rankBadgeHTML(p.rankMedal||'Unknown',p.rankLabel)}</div><div class="player-wr">${p.winrate!=null?`<div class="wr-number">${p.winrate}%</div><div class="wr-label">${isConsole?'PUB WR':'pub wr'}</div>`:'<div class="wr-number" style="font-size:14px;color:var(--ink-4)">\u2014</div>'}</div></div><div class="hero-section"><div class="hero-section-label">${isConsole?'// ':''}CM picks (E-Sparven)${hasBanCandidate?`<span style="font-size:9px;color:var(--ban-high);margin-left:4px">\u25cf ban candidate</span>`:''}</div>${renderHeroRows(p.tournamentHeroes,true,isSelf)}</div><div class="hero-section"><div class="hero-section-label">${isConsole?'// ':''}Pub pool</div>${renderHeroRows(p.pubHeroes,false,isSelf)}</div>${form?`<div class="form-row"><div class="form-label">Form</div>${form}</div>`:''}${profileLinks(p.accountId)}</div>`;}

function renderHistory(history,currentSeasonId){if(!history||!history.length)return'';const isConsole=document.documentElement.getAttribute('data-theme')==='console';const filtered=history.filter(m=>{if(!currentSeasonOnly)return true;if(m.seasonId==null)return true;return m.seasonId===currentSeasonId;});const seasonLabel=currentSeasonOnly?' this season':'';const title=`${isConsole?'// ':''}Opponent's E-Sparven match history${seasonLabel}`;if(!filtered.length)return`<div class="page-section page-section-history history-section"><div class="section-title">${title}</div><div style="font-size:13px;color:var(--ink-4)">No games recorded${seasonLabel}.</div></div>`;const chipGroup=(picks,team)=>{const chips=(picks||[]).filter(pk=>pk.team===team).map(pk=>{const url=heroIconUrl(pk.heroName,pk.iconUrl);return`<span class="hero-chip"><div class="hero-chip-icon">${url?`<img src="${url}" alt="${pk.heroName}" loading="lazy">`:''}</div>${pk.heroName}</span>`;}).join('');return chips||'<span style="font-size:11px;color:var(--ink-4)">\u2014</span>';};const rows=filtered.map(m=>{const oppTeam=m.opponentTeam??null,oppWon=m.opponentWon??null;const resultBadge=oppWon===true?'<span class="result-badge win">W</span>':oppWon===false?'<span class="result-badge loss">L</span>':'';const sideLabel=t=>oppTeam===null?'':t===oppTeam?`<span style="font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--upcoming);background:var(--upcoming-bg);padding:1px 5px;border-radius:${isConsole?'0':'3px'};margin-right:4px${isConsole?';font-family:Orbitron,monospace;letter-spacing:2px':''}">OPP</span>`:`<span style="font-size:9px;color:var(--ink-4);background:var(--line-2);padding:1px 5px;border-radius:${isConsole?'0':'3px'};margin-right:4px">vs</span>`;return`<tr><td class="mono">${m.duration||'\u2014'}</td><td>${resultBadge?`<span style="margin-right:6px">${resultBadge}</span>`:''}${sideLabel(0)}${chipGroup(m.picks,0)}</td><td>${sideLabel(1)}${chipGroup(m.picks,1)}</td><td class="mono" style="color:var(--ink-4)">${m.patch?`patch ${m.patch}`:''}</td><td style="white-space:nowrap"><a class="player-link" href="https://www.opendota.com/matches/${m.matchId}" target="_blank" rel="noopener noreferrer" style="font-size:10.5px;padding:2px 8px">Match</a></td></tr>`;}).join('');return`<div class="page-section page-section-history history-section"><div class="section-title">${title}</div><table class="history-table"><thead><tr><th>Duration</th><th>Radiant</th><th>Dire</th><th>Patch</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;}

function fmtDate(iso){if(!iso)return'\u2014';return new Date(iso).toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}

const TICKER_ITEMS=['PATCH 7.37 // DARK WILLOW REWORKED','TORNKN\u00c4CKARNA // CAPTAIN\'S MODE','E-SPARVEN DIVISION // CURRENT SEASON','ENIGMA BLACK HOLE // HIGH BAN PRIORITY','INVOKER // WINRATE ELEVATED IN CM','REMEMBER: DRAFT TEMPO WINS GAMES','ROSHAN SPAWNS AT 00:00 // TRACK IT','OBSERVER WARDS // PLACE EARLY','SMOKE ROTATIONS // SECURE OBJECTIVES','NET WORTH DELTA // KEY METRIC','CM DRAFT PHASE // 5 BANS EACH SIDE','ANALYSIS: PUSH LINEUPS STRONG PATCH'];
function buildTicker(matches,tickerSnippets){const parts=tickerSnippets&&tickerSnippets.length?[...tickerSnippets]:[...TICKER_ITEMS];const upcoming=matches.filter(m=>m.status==='upcoming');const past=matches.filter(m=>m.status!=='upcoming');if(upcoming.length)parts.unshift(`NEXT MATCH ${upcoming[0].opponent.toUpperCase()} ${fmtDate(upcoming[0].date).toUpperCase()}`);const lastWin=past.find(m=>m.status==='win');const lastLoss=past.find(m=>m.status==='loss');if(lastWin)parts.unshift(`LAST WIN ${lastWin.opponent.toUpperCase()}`);if(lastLoss)parts.unshift(`LAST LOSS ${lastLoss.opponent.toUpperCase()}`);const full=[...parts,...parts].join('   ///   ');const el=document.getElementById('sidebar-ticker-text');if(el)el.textContent=full;}

// DRAFT ASSISTANT MODULE
// ══════════════════════════════════════════════════════════════════════════════
//
// Collapsible panel attached to match panels.
// Features:
//   - Side selector (we are first pick / second pick)
//   - 24-slot CM draft board in correct 7.34 order, colour-coded per team
//   - Hero dropdowns with search, icons, per slot
//   - Live counterpick suggestions per lane (safe/mid/off/soft/hard)
//   - Scores by summing positive matchup WR contributions across all enemy picks
//   - Pub pool weighting toggle (default ON) — reads our team gist pub heroes
//   - Scouting ban suggestions pre-filled alongside our ban slots
//   - Session-cached OpenDota matchup data and hero list

// ── State ────────────────────────────────────────────────────────────────────
const DA = {
  open:          false,
  weAreFirst:    true,    // true = we have first pick
  pubWeighting:  true,    // default ON
  slots:         Array(24).fill(null), // { heroName, heroId, isUs, isBan }
  heroList:      null,    // fetched from OpenDota once
  heroIconMap:   {},      // localized_name -> full CDN icon URL, built from heroList
  matchupCache:  {},      // hero_id -> matchup array
  heroBaseWRs:   null,    // hero_id -> global pub WR, from /api/heroStats
  ourPubHeroes:  null,    // fetched from OUR_TEAM_GIST once per session
  scoutData:     null,    // current match gist data
  laneFilter:    null,    // null = all lanes, or 'safe','mid','off','soft','hard'
  _suggGen:      0,       // generation counters — prevents stale async renders
  _banGen:       0,
};

// isFirst = true means this slot belongs to the first-pick team
// isBan = true means this is a ban slot

  {idx:0,  isBan:true,  isFirst:true,  phase:'Ban phase 1', label:'Ban 1'},
  {idx:1,  isBan:true,  isFirst:false, phase:'Ban phase 1', label:'Ban 1'},
  {idx:2,  isBan:true,  isFirst:true,  phase:'Ban phase 1', label:'Ban 2'},

  {idx:8,  isBan:false, isFirst:false, phase:'Pick phase 1', label:'Pick 1'},

function heroToLane(h) {
  const override = HERO_LANE_OVERRIDE[h.localized_name];
  if (override) return override;
  const roles = h.roles || [];
  const has = r => roles.includes(r);
  if (has('Support') && has('Healer')) return 'hard';
  if (has('Support') && (has('Disabler') || has('Initiator') || has('Nuker') || has('Escape'))) return 'soft';
  if (has('Support')) return 'hard';
  if (has('Carry') && !has('Initiator')) return 'safe';
  if ((has('Nuker') || has('Escape')) && !has('Durable') && !has('Initiator')) return 'mid';
  if (has('Initiator') || has('Durable')) return 'off';
  if (has('Carry')) return 'safe';
  if (has('Pusher') || has('Jungler')) return 'off';
  return 'mid';
}

// ── OpenDota fetchers ─────────────────────────────────────────────────────────
async function daFetchHeroList() {
  if (DA.heroList) return DA.heroList;
  try {
    const r = await fetch('https://api.opendota.com/api/heroes');
    DA.heroList = await r.json();
    // Build name -> icon URL map for all heroes, including new ones not in HERO_SLUG
    for (const h of DA.heroList) {
      if (h.localized_name && h.icon) {
        const url = h.icon.startsWith('http')
          ? h.icon
          : `https://steamcdn-a.akamaihd.net${h.icon}`;
        DA.heroIconMap[h.localized_name] = url;
      }
    }
  } catch(e) {
    DA.heroList = [];
  }
  return DA.heroList;
}

async function daFetchMatchups(heroId) {
  if (DA.matchupCache[heroId]) return DA.matchupCache[heroId];
  try {
    const r = await fetch(`https://api.opendota.com/api/heroes/${heroId}/matchups`);
    const data = await r.json();
    DA.matchupCache[heroId] = data;
    return data;
  } catch(e) {
    return [];
  }
}

async function daFetchOurPubHeroes() {
  if (DA.ourPubHeroes !== null) return DA.ourPubHeroes;
  if (!OUR_TEAM_GIST_ID) { DA.ourPubHeroes = []; return []; }
  try {
    const data = await fetchGist(OUR_TEAM_GIST_ID);
    // Flatten all players' pubHeroes into [{playerName, heroName, games, wr}]
    const list = [];
    for (const p of (data.players || [])) {
      for (const h of (p.pubHeroes || [])) {
        list.push({playerName: p.name, heroName: h.name, games: h.games || 0, wr: h.wr || 0});
      }
    }
    DA.ourPubHeroes = list;
  } catch(e) {
    DA.ourPubHeroes = [];
  }
  return DA.ourPubHeroes;
}

async function daFetchHeroBaseWRs() {
  if (DA.heroBaseWRs !== null) return DA.heroBaseWRs;
  try {
    const r = await fetch('https://api.opendota.com/api/heroStats');
    const data = await r.json();
    const map = {};
    for (const h of data) {
      if (h.id && h.pub_pick) map[h.id] = h.pub_win / h.pub_pick;
    }
    DA.heroBaseWRs = map;
  } catch(e) {
    DA.heroBaseWRs = {};
  }
  return DA.heroBaseWRs;
}

// ── Scoring ───────────────────────────────────────────────────────────────────
// Combined score = matchup quality × breadth multiplier × pool multiplier.
//
// matchup quality: sum of (WR advantage above global baseline × log(sample size))
//   for each enemy pick this hero beats. Larger sample and bigger advantage = higher.
//
// breadth multiplier (×1.0–1.25): heroes that counter many enemies at once rank
//   higher than those dominating just one. Fraction of enemies countered scales it.
//
// pool multiplier (×1.0–1.5): heroes that someone on our team plays with a good
//   pub WR get a smooth boost. Best player's WR drives it — 50% → no bonus,
//   70%+ → +50%. This keeps great counterpicks at the top even without pool heroes.
function daScoreHero(candidateId, enemyMatchupSets, pubList, candidateName, baseWRs) {
  const baseline = (baseWRs && baseWRs[candidateId]) || 0.50;
  let matchupScore = 0;
  let counteredEnemies = 0;
  for (const matchups of enemyMatchupSets) {
    const entry = matchups.find(m => m.hero_id === candidateId);
    if (!entry || !entry.games_played) continue;
    // OpenDota wins = queried hero's (enemy's) wins; invert to get candidate's WR vs enemy.
    const wr = 1 - entry.wins / entry.games_played;
    const advantage = wr - baseline;
    if (advantage <= 0) continue;
    matchupScore += advantage * Math.log(entry.games_played + 1);
    counteredEnemies++;
  }
  if (!matchupScore) return 0;

  // Breadth: fraction of enemy picks countered, scaled to [1.0, 1.25]
  const breadth = counteredEnemies / Math.max(1, enemyMatchupSets.length);
  matchupScore *= (1 + 0.25 * breadth);

  // Pool: best player's WR with this hero gives a smooth [0, +50%] bonus
  if (DA.pubWeighting && pubList.length) {
    const playerEntries = pubList.filter(p => p.heroName === candidateName && p.games >= 10);
    if (playerEntries.length) {
      const bestWR = Math.max(...playerEntries.map(p => p.wr));
      const poolBonus = Math.max(0, Math.min(0.5, (bestWR - 50) / 40));
      matchupScore *= (1 + poolBonus);
    }
  }

  return matchupScore;
}

// ── Picker ────────────────────────────────────────────────────────────────────
let _daActiveSlot = null;

function daCycleSlot(idx, event) {
  event.stopPropagation();
  _daActiveSlot = idx;
  const picker = document.getElementById('da-picker');
  if (!picker) return;
  picker.style.display = 'block';
  const search = document.getElementById('da-search');
  if (search) { search.value = ''; search.focus(); }
  daFilterHeroes();
}

function daClosePicker() {
  _daActiveSlot = null;
  const picker = document.getElementById('da-picker');
  if (picker) picker.style.display = 'none';
}

function daFilterHeroes() {
  const grid = document.getElementById('da-hero-grid');
  const search = document.getElementById('da-search');
  if (!grid || !DA.heroList) {
    if (grid) grid.innerHTML = '<div style="font-size:12px;color:var(--ink-4)">Loading heroes…</div>';
    daFetchHeroList().then(() => daFilterHeroes());
    return;
  }
  const q = (search ? search.value : '').toLowerCase();
  const taken = new Set(DA.slots.filter(Boolean).map(s => s.heroName));

  const filtered = [...DA.heroList]
    .filter(h => h.localized_name.toLowerCase().includes(q))
    .sort((a, b) => a.localized_name.localeCompare(b.localized_name));

  grid.innerHTML = filtered.map(h => {
    const url = heroIconUrl(h.localized_name, '');
    const isTaken = taken.has(h.localized_name);
    return `<div onclick="${isTaken?'':'daSelectHero('+h.id+')'}" title="${h.localized_name}${isTaken?' (in draft)':''}" style="
      display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;
      border-radius:6px;cursor:${isTaken?'not-allowed':'pointer'};
      opacity:${isTaken?'0.3':'1'};
      background:var(--line-2);
      border:1px solid var(--line);
      transition:background .12s;
    " onmouseover="if(!${isTaken})this.style.background='var(--line)'" onmouseout="this.style.background='var(--line-2)'">
      ${url?`<img src="${url}" style="width:32px;height:32px;border-radius:4px;object-fit:cover">` : '<div style="width:32px;height:32px;background:var(--line);border-radius:4px"></div>'}
      <div style="font-size:8px;color:var(--ink-3);text-align:center;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.localized_name}</div>
    </div>`;
  }).join('');
}

function daSelectHero(heroId) {
  if (_daActiveSlot === null || !DA.heroList) return;
  const hero = DA.heroList.find(h => h.id === heroId);
  if (!hero) return;
  const slot = CM_SLOTS[_daActiveSlot];
  const isUs = DA.weAreFirst ? slot.isFirst : !slot.isFirst;
  DA.slots[_daActiveSlot] = { heroName: hero.localized_name, heroId, isUs, isBan: slot.isBan };
  daClosePicker();
  renderDraftBoard();
  daUpdateBanHints();
  daUpdateSuggestions();
}

function daClearAll() {
  DA.slots = Array(24).fill(null);
  renderDraftBoard();
  daUpdateBanHints();
  daUpdateSuggestions();
}

function daSetSide(isFirst) {
  DA.weAreFirst = isFirst;
  renderDraftBoard();
  daUpdateBanHints();
  daUpdateSuggestions();
}

function daSetLaneFilter(lane) {
  DA.laneFilter = lane;
  daUpdateSuggestions();
}

function daSetWeighting(on) {
  DA.pubWeighting = on;
  // Update button active states without full re-render
  const panel = document.getElementById('da-panel');
  if (panel) {
    panel.querySelectorAll('.da-weight-btn').forEach(btn => {
      const wantsOn = btn.dataset.weight === 'on';
      btn.classList.toggle('active', wantsOn === on);
    });
  }
  daUpdateSuggestions();
}

// ── Suggestions ───────────────────────────────────────────────────────────────
async function daUpdateSuggestions() {
  const el = document.getElementById('da-suggestions');
  if (!el) return;

  const gen = ++DA._suggGen;

  const isConsole = document.documentElement.getAttribute('data-theme') === 'console';

  // Enemy picks = slots assigned to opponent that are picks (not bans)
  const enemyPicks = DA.slots.filter(s => s && !s.isUs && !s.isBan);
  // Our picks already chosen = remove from suggestions
  const ourPicks   = new Set(DA.slots.filter(s => s && s.isUs && !s.isBan).map(s => s.heroName));
  // All taken heroes (both sides, picks + bans)
  const taken      = new Set(DA.slots.filter(Boolean).map(s => s.heroName));

  if (!enemyPicks.length) {
    el.innerHTML = `<div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line);${isConsole?'font-family:Orbitron,monospace;':''}">Counterpick suggestions</div><div style="font-size:12px;color:var(--ink-4)">Add enemy picks to the draft board to see counterpick suggestions.</div>`;
    return;
  }

  el.innerHTML = `<div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line);${isConsole?'font-family:Orbitron,monospace;':''}">Counterpick suggestions</div><div style="font-size:12px;color:var(--ink-4);padding:8px 0">Calculating\u2026</div>`;

  // Fetch hero list, pub heroes, and base WRs in parallel; then all matchups in parallel
  const [heroes, pubList, baseWRs] = await Promise.all([
    daFetchHeroList(),
    DA.pubWeighting ? daFetchOurPubHeroes() : Promise.resolve([]),
    daFetchHeroBaseWRs(),
  ]);
  if (gen !== DA._suggGen) return;

  if (!heroes.length) {
    el.innerHTML += '<div style="color:var(--loss);font-size:12px">Could not load hero data.</div>';
    return;
  }

  // Fetch matchups for all enemy picks in parallel — keyed by heroId so indices never drift
  const enemyMatchupMap = {}; // heroId -> matchup array
  await Promise.all(enemyPicks.map(async ep => {
    const matchups = await daFetchMatchups(ep.heroId);
    if (matchups.length) enemyMatchupMap[ep.heroId] = matchups;
  }));
  if (gen !== DA._suggGen) return;

  const enemyMatchupSets = Object.values(enemyMatchupMap);

  if (!enemyMatchupSets.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--ink-4)">Could not fetch matchup data.</div>';
    return;
  }

  // Score all non-taken heroes
  const scored = heroes
    .filter(h => !taken.has(h.localized_name))
    .map(h => ({
      hero: h,
      score: daScoreHero(h.id, enemyMatchupSets, pubList, h.localized_name, baseWRs),
      lane: heroToLane(h),
      pubPlayers: pubList.filter(p => p.heroName === h.localized_name && p.games >= 10),
      counters: enemyPicks.filter(ep => {
        const set = enemyMatchupMap[ep.heroId];
        if (!set) return false;
        const entry = set.find(m => m.hero_id === h.id);
        if (!entry || !entry.games_played) return false;
        // wins = enemy's wins; invert to get candidate's WR vs this enemy pick.
        return (1 - entry.wins / entry.games_played) > ((baseWRs[h.id] || 0.50) + 0.01);
      }).map(ep => ep.heroName),
    }))
    .filter(s => s.score > 0)
    .sort((a, b) => b.score - a.score);

  const maxScore = scored[0]?.score || 1;

  // Pool multiplier is already baked into score — just sort and show.
  const pool = scored;

  // Apply lane filter
  const visible = DA.laneFilter
    ? pool.filter(s => s.lane === DA.laneFilter)
    : pool;

  const top = visible.slice(0, 5);

  // Lane filter buttons
  const laneFilterHTML = () => {
    const btn = (lane, label) => {
      const active = DA.laneFilter === lane;
      return `<button onclick="daSetLaneFilter(${lane?`'${lane}'`:'null'})" style="
        background:${active?'var(--accent)':'var(--line-2)'};
        color:${active?'#fff':'var(--ink-3)'};
        border:1px solid ${active?'var(--accent)':'var(--line)'};
        border-radius:var(--radius-sm);
        cursor:pointer;font-family:inherit;
        font-size:10px;font-weight:600;letter-spacing:.04em;
        padding:4px 10px;white-space:nowrap;
        transition:background .12s,color .12s;
      ">${label}</button>`;
    };
    return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
      <span style="font-size:10px;color:var(--ink-4);flex-shrink:0">Lane:</span>
      ${btn(null,      'All')}
      ${btn('safe',    'Safe')}
      ${btn('mid',     'Mid')}
      ${btn('off',     'Off')}
      ${btn('soft',    'Soft supp')}
      ${btn('hard',    'Hard supp')}
    </div>`;
  };

  // Enemy picks chips
  const enemySummary = enemyPicks.map(ep => {
    const url = heroIconUrl(ep.heroName, '');
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--loss-bg);border:1px solid var(--loss);border-radius:4px;padding:2px 7px 2px 3px;font-size:11px;color:var(--loss)">
      ${url?`<img src="${url}" style="width:16px;height:16px;border-radius:2px;object-fit:cover">`:''}
      ${ep.heroName}
    </span>`;
  }).join('');

  // Suggestion cards
  const suggCard = (s, rank) => {
    const url = heroIconUrl(s.hero.localized_name, '');
    const barW = Math.round((s.score / maxScore) * 100);
    const laneLabel = LANE_LABELS[s.lane] || s.lane;
    const counterText = s.counters.length ? s.counters.join(', ') : '';
    const playerText  = s.pubPlayers.length
      ? s.pubPlayers.map(p => `${p.playerName} · ${p.games}g ${p.wr}%`).join('  ·  ')
      : '';
    const inPool = s.pubPlayers.length > 0;

    return `<div style="
      display:flex;align-items:center;gap:12px;
      padding:12px 14px;
      background:var(--surface);
      border:1px solid ${inPool && DA.pubWeighting ? 'var(--win)' : 'var(--line)'};
      border-left:3px solid ${inPool && DA.pubWeighting ? 'var(--win)' : 'var(--line)'};
      border-radius:${isConsole?'0':'8px'};
      margin-bottom:8px;
    ">
      <div style="font-size:11px;font-weight:700;color:var(--ink-4);width:18px;text-align:center;flex-shrink:0">${rank}</div>
      ${url
        ? `<img src="${url}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0">`
        : `<div style="width:40px;height:40px;background:var(--line-2);border-radius:6px;flex-shrink:0"></div>`}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">
          <span style="font-size:14px;font-weight:600;color:var(--ink)">${s.hero.localized_name}</span>
          <span style="font-size:10px;color:var(--ink-4);background:var(--line-2);padding:1px 6px;border-radius:3px">${laneLabel}</span>
          ${inPool && DA.pubWeighting ? `<span style="font-size:10px;color:var(--win)">In our pool</span>` : ''}
        </div>
        <div style="height:3px;background:var(--line);border-radius:2px;margin-bottom:6px;overflow:hidden">
          <div style="height:3px;width:${barW}%;background:var(--win);border-radius:2px"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px">
          ${counterText ? `<div style="font-size:11px;color:var(--win)">✓ Counters: ${counterText}</div>` : ''}
          ${playerText  ? `<div style="font-size:11px;color:var(--ink-3)">${playerText}</div>` : ''}
        </div>
      </div>
    </div>`;
  };

  let html = `
    <div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line);${isConsole?'font-family:Orbitron,monospace;':''}">
      Counterpick suggestions
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <span style="font-size:10px;color:var(--ink-4);flex-shrink:0">Against:</span>
      ${enemySummary}
    </div>
    ${laneFilterHTML()}
    ${top.length
      ? top.map((s, i) => suggCard(s, i + 1)).join('')
      : `<div style="font-size:12px;color:var(--ink-4)">No suggestions for this filter — try a different lane or add more enemy picks.</div>`}
  `;

  if (gen !== DA._suggGen) return;
  el.innerHTML = html;
}

// ── Ban suggestions from scouting data ────────────────────────────────────────────
// Base score: keyPickScore from opponent CM history (games, WR, delta vs pub).
// Counter-threat bonus: for each of our revealed picks, fetch matchup data.
//   Any hero in the opponent pool that beats our pick gets a bonus proportional
//   to how far above 50% its win rate is against that pick. The more of our picks
//   it threatens, the higher it scores as a ban priority.
// Already-taken heroes are always filtered out regardless.

async function _daBanSuggestions() {
  if (!DA.scoutData) return [];

  const taken = new Set(DA.slots.filter(Boolean).map(s => s.heroName));
  const ourPicks = DA.slots.filter(s => s && s.isUs && !s.isBan);

  // Build base candidates from opponent CM history
  const baseMap = {};
  for (const p of (DA.scoutData.players || [])) {
    for (const h of (p.tournamentHeroes || [])) {
      const score = keyPickScore(h);
      if (!score) continue;
      if (!baseMap[h.name] || score > baseMap[h.name].score) {
        baseMap[h.name] = { name: h.name, iconUrl: h.iconUrl || '', score };
      }
    }
  }

  // Counter-threat bonus: fetch matchup data for all revealed picks in parallel.
  // Heroes that counter our picks get a score boost; unscouted counters are merged in.
  const extThreats = {};
  if (ourPicks.length) {
    const [heroes, baseWRs] = await Promise.all([daFetchHeroList(), daFetchHeroBaseWRs()]);

    // Pre-fetch all matchups in parallel, then process from cache
    const ourPicksWithHeroes = ourPicks
      .map(p => ({ pick: p, hero: heroes.find(h => h.localized_name === p.heroName) }))
      .filter(p => p.hero);
    await Promise.all(ourPicksWithHeroes.map(p => daFetchMatchups(p.hero.id)));

    for (const { hero: ourHero } of ourPicksWithHeroes) {
      const matchups = DA.matchupCache[ourHero.id] || [];
      for (const m of matchups) {
        if (!m.games_played) continue;
        // wins = our hero's wins against opponent m; invert to get opponent's WR vs our pick.
        const theirWR = 1 - m.wins / m.games_played;
        const baseline = baseWRs[m.hero_id] || 0.50;
        const advantage = theirWR - baseline;
        if (advantage <= 0.005) continue;
        const threatHero = heroes.find(h => h.id === m.hero_id);
        if (!threatHero) continue;
        const threatName = threatHero.localized_name;
        if (baseMap[threatName]) {
          baseMap[threatName].score += advantage * 1.5;
        } else {
          if (!extThreats[threatName]) {
            extThreats[threatName] = { name: threatName, score: 0, iconUrl: DA.heroIconMap[threatName] || '', external: true };
          }
          extThreats[threatName].score += advantage * 1.5;
        }
      }
    }
  }

  // Merge scouted heroes and external threats, sort by score, deduplicate
  const allCandidates = [
    ...Object.values(baseMap),
    ...Object.values(extThreats).filter(c => c.score > 0.01),
  ];
  const seen = new Set();
  return allCandidates
    .filter(c => !taken.has(c.name))
    .sort((a, b) => b.score - a.score)
    .filter(c => { if (seen.has(c.name)) return false; seen.add(c.name); return true; });
}

// Fills ban hint ghost icons into pre-rendered slot containers after async scoring
async function daUpdateBanHints() {
  const gen = ++DA._banGen;
  const suggestions = await _daBanSuggestions();
  if (gen !== DA._banGen) return;
  const isUs = slot => DA.weAreFirst ? slot.isFirst : !slot.isFirst;
  let hintIdx = 0;
  for (const slot of CM_SLOTS) {
    if (!slot.isBan || !isUs(slot)) continue;
    const el = document.getElementById('da-hint-' + slot.idx);
    if (!el) continue;
    const filled = DA.slots[slot.idx];
    if (filled) { el.innerHTML = ''; continue; }
    const suggestion = suggestions[hintIdx++];
    if (suggestion) {
      const url = heroIconUrl(suggestion.name, suggestion.iconUrl || '');
      const tipPrefix = suggestion.external ? 'Unscouted counter: ' : 'Suggested ban: ';
      el.innerHTML = url
        ? '<img src="' + url + '" alt="' + suggestion.name + '" title="' + tipPrefix + suggestion.name + '" style="width:16px;height:16px;border-radius:2px;opacity:0.5;position:absolute;bottom:2px;right:2px">'
        : '';
    } else {
      el.innerHTML = '';
    }
  }
}

// ── Debug mode (Shift+B) ─────────────────────────────────────────────────────────────
// No API calls are made to generate the debug panel.
// OpenDota matchup calls will still fire if you use the draft assistant.

(function() {
  const DEBUG_HEROES = [
    'Invoker','Enigma','Storm Spirit','Templar Assassin','Pudge',
    'Earthshaker','Puck','Shadow Fiend','Lina','Lion',
    'Crystal Maiden','Windranger','Rubick','Magnus','Tidehunter',
    'Axe','Dragon Knight','Juggernaut','Anti-Mage','Phantom Assassin',
    'Witch Doctor','Vengeful Spirit','Dazzle','Jakiro','Warlock',
    'Void Spirit','Ember Spirit','Earth Spirit','Timbersaw','Bristleback',
  ];

  const DEBUG_NAMES = [
    'meta engineer','whoppe','tobieee','Hansson','srs blck',
  ];

  const DEBUG_RANKS = [
    {rankMedal:'Ancient',  rankLabel:'Ancient IV'},
    {rankMedal:'Divine',   rankLabel:'Divine II'},
    {rankMedal:'Immortal', rankLabel:'Immortal'},
    {rankMedal:'Legend',   rankLabel:'Legend III'},
    {rankMedal:'Ancient',  rankLabel:'Ancient I'},
  ];

  function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr, n) {
    const copy = [...arr].sort(() => Math.random() - 0.5);
    return copy.slice(0, n);
  }

  function fakePlayer(idx) {
    const tHeroes = pick(DEBUG_HEROES, rnd(2, 4)).map(name => ({
      name,
      iconUrl: '',
      tournamentGames:    rnd(2, 8),
      tournamentWR:       rnd(40, 80),
      currentSeasonGames: rnd(1, 5),
      currentSeasonWR:    rnd(40, 80),
      recentSeason:       Math.random() > 0.3,
      pubWR:              rnd(45, 65),
      pubGames:           rnd(10, 60),
    }));
    const pubHeroes = pick(DEBUG_HEROES, 5).map(name => ({
      name,
      games: rnd(10, 80),
      wr:    rnd(44, 66),
    }));
    const form = Array.from({length: 10}, () => Math.random() > 0.45 ? 'w' : 'l');
    return {
      name:      DEBUG_NAMES[idx] || `Player ${idx + 1}`,
      accountId: rnd(10000000, 199999999),
      confirmed: true,
      ...DEBUG_RANKS[idx % DEBUG_RANKS.length],
      winrate:   rnd(47, 62),
      form,
      tournamentHeroes: tHeroes,
      pubHeroes,
    };
  }

  function fakeHistory() {
    const games = rnd(2, 5);
    const history = [];
    for (let i = 0; i < games; i++) {
      const oppTeam = rnd(0, 1);
      const oppWon  = Math.random() > 0.5;
      const picks = pick(DEBUG_HEROES, 10).map((heroName, j) => ({
        heroName,
        iconUrl: '',
        team: j < 5 ? 0 : 1,
      }));
      const bans = pick(DEBUG_HEROES.filter(h => !picks.find(p => p.heroName === h)), 14)
        .map((heroName, j) => ({ heroName, iconUrl: '', team: j % 2 }));
      history.push({
        matchId:      String(rnd(7000000000, 7999999999)),
        duration:     `${rnd(28, 55)}:${String(rnd(0,59)).padStart(2,'0')}`,
        patch:        '7.37',
        seasonId:     67,
        opponentTeam: oppTeam,
        opponentWon:  oppWon,
        picks,
        bans,
      });
    }
    return history;
  }

  function fakeTendencies(players) {
    const allHeroes = players.flatMap(p => p.tournamentHeroes);
    const picked = pick(DEBUG_HEROES, 5).map((name, i) => ({
      name, count: rnd(2, 6), iconUrl: '',
    }));
    const banned = pick(DEBUG_HEROES.filter(h => !picked.find(p => p.name === h)), 5)
      .map((name, i) => ({ name, count: rnd(2, 6), iconUrl: '' }));
    const orderPatterns = [
      { slot:0, label:'1st ban',  isPick:false, hero:banned[0]?.name||'Invoker',   count:rnd(2,4), pct:rnd(50,80), iconUrl:'' },
      { slot:1, label:'2nd ban',  isPick:false, hero:banned[1]?.name||'Enigma',    count:rnd(2,4), pct:rnd(40,70), iconUrl:'' },
      { slot:0, label:'1st pick', isPick:true,  hero:picked[0]?.name||'Earthshaker',count:rnd(2,4),pct:rnd(50,80), iconUrl:'' },
      { slot:1, label:'2nd pick', isPick:true,  hero:picked[1]?.name||'Lina',      count:rnd(2,3), pct:rnd(40,65), iconUrl:'' },
    ];
    return {
      totalGames:    rnd(4, 10),
      mostPicked:    picked,
      mostBanned:    banned,
      orderPatterns,
    };
  }

  function buildDebugData() {
    const players = Array.from({length: 5}, (_, i) => fakePlayer(i));
    const history  = fakeHistory();
    const draftTendencies = fakeTendencies(players);
    return {
      meetingId:       'DEBUG',
      opponent:        'Debug Opponent',
      date:            new Date().toISOString(),
      status:          'upcoming',
      snapshotAt:      new Date().toISOString(),
      currentSeasonId: 67,
      players,
      history,
      draftTendencies,
    };
  }

  function activateDebug() {
    const data = buildDebugData();

    // Mark the sidebar so it's obvious debug mode is active
    const existing = document.getElementById('debug-badge');
    if (!existing) {
      const badge = document.createElement('div');
      badge.id = 'debug-badge';
      badge.textContent = 'DEBUG';
      badge.style.cssText = [
        'position:fixed','bottom:12px','right:12px','z-index:99998',
        'background:#f59e0b','color:#000','font-size:9px','font-weight:700',
        'letter-spacing:.12em','padding:4px 10px','border-radius:4px',
        'font-family:Orbitron,monospace','pointer-events:none',
      ].join(';');
      document.body.appendChild(badge);
    }

    // Deselect sidebar items
    document.querySelectorAll('.match-item').forEach(el => el.classList.remove('active'));

    // Cache the fake data so the season toggle and draft assistant work
    _currentMatchData    = { ...data };
    _currentMatchContext = { meetingId: 'DEBUG', isSelf: false };

    runBootSequence(() => _renderMatchPanel(data, 'DEBUG'));
  }

  // Remove debug badge when navigating away
  const _origLoadMatch = window.loadMatch;
  window.loadMatch = function(...args) {
    const b = document.getElementById('debug-badge');
    if (b) b.remove();
    return _origLoadMatch?.apply(this, args);
  };

  // Shift+B listener
  document.addEventListener('keydown', e => {
    if (e.shiftKey && e.key === 'B' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      // Don't fire if focus is in a text input (e.g. the hero search box)
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      activateDebug();
    }
  });
})();

// ── Boot ──────────────────────────────────────────────────────────────────────
(async()=>{// Fetch hero icon map and index gist in parallel
daFetchHeroList();// fire-and-forget — populates DA.heroIconMap before panels render
let index;try{index=await fetchGist(INDEX_GIST_ID);}catch(e){document.getElementById('sidebar-content').innerHTML=`<div style="padding:20px 22px;color:var(--loss);font-size:13px">Failed to load index: ${e.message}</div>`;return;}const matches=index.matches||[];const tickerSnippets=index.tickerSnippets||[];buildSidebar(matches,tickerSnippets);const first=matches.find(m=>m.status==='upcoming')||[...matches].reverse().find(m=>m.status!=='upcoming');if(first)loadMatch(first.gistId,first.meetingId||'',document.querySelector(`[data-bin="${first.gistId}"]`));})();
