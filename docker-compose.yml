name: tornknackarna

services:
  scout:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # state.json, player_map.json and the ready check database live in data/.
      - ./data:/app/data
      # Old locations, read-only. On first start the bot copies them into
      # data/ if they're missing there. Safe to delete these two lines (and
      # the files) once data/state.json and data/player_map.json exist.

  ready:
    build: .
    command: ["python", "ready_bot.py"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
