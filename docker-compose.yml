name: tornknackarna

services:
  scout:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # state.json, player_map.json and the ready check database live in data/.
      - ./data:/app/data

  ready:
    build: .
    command: ["python", "ready_bot.py"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
